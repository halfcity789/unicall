[project]
name = "unicall"
version = "0.1.0"
description = "Function-level emulation for PE & ELF on Unicorn — emulate any single function with one call"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "halfcity" }]
keywords = ["unicorn", "emulation", "reverse-engineering", "malware-analysis", "pe", "elf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "unicorn>=2.0.1",
  "capstone>=5.0",
  "pyelftools>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unicall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
